[package]
name = "subutf8-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "subutf8"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
encoding_rs = "0.8.42"
getrandom = "0.4.3"
# Local dates and times for the day folders and the history, from TZ or /etc/localtime; the
# bundled time-zone table lets TZ=Europe/… work in the container, which has no zoneinfo.
jiff = { version = "0.2.37", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always", "tzdb-zoneinfo"] }
# SHA-256 for update downloads; already built for ureq's TLS.
ring = { version = "0.17.14", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subutf8-core = { path = "../subutf8-core" }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
# The update check and download: HTTPS with rustls and Mozilla's root certificates, so every
# build, the container included, checks certificates the same way.
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints]
workspace = true
