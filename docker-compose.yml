# SubUTF8: converts .srt subtitles to UTF-8 in the browser, on this server.
#
#   1. Change the two /path/to/... folders below to yours.
#   2. docker compose up -d
#   3. Open http://<server-ip>:61880 from any machine on your network.

services:
  subutf8:
    image: ghcr.io/aiulian25/subutf8:latest
    container_name: subutf8
    ports:
      # There is no login: anyone who can reach this port can convert subtitles in the
      # folders below. Use "127.0.0.1:61880:61880" to keep it on this machine only.
      - "61880:61880"
    # Converted files belong to this user and group; run `id -u` and `id -g` for yours,
    # or set PUID and PGID in a .env file next to this one (see .env.example).
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      # Your time zone, such as Europe/London. It names the daily folders in /output.
      - TZ=Etc/UTC
      # # More folders to browse besides /media and /mnt, separated by colons. Only list
      # # folders you also mount below.
      # - SUBUTF8_BROWSE_ROOTS=/srv/subtitles
      # # Host names to answer to, for example behind a reverse proxy. IP addresses
      # # always work.
      # - SUBUTF8_ALLOWED_HOSTS=subtitles.example.lan
      # # How often watched folders are checked, in seconds (60 by default).
      # - SUBUTF8_WATCH_INTERVAL=60
      # # The app asks GitHub once a day whether a newer version exists; 0 turns that off.
      # - SUBUTF8_UPDATE_CHECK=0
    volumes:
      # Settings and the list of converted files; they survive updates of the container.
      - subutf8-data:/data
      # Converted files, in a folder for each day, such as 2026-09-27. Create this folder
      # before starting, so it belongs to PUID and PGID.
      - /path/to/converted:/output
      # Everything mounted under /media or /mnt shows up in the app's Browse view, and can be
      # watched for new subtitles (Settings, Watch folders). Add ":ro" to protect the
      # originals; converted files then go to /output.
      - /path/to/your/subtitles:/media/subtitles
      # More folders, for example:
      # - /path/to/movies:/media/movies
      # - /path/to/nas-share:/mnt/nas
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  subutf8-data:
